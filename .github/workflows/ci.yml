name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.6.8 pytest-cov

      - name: Install Python 3.13 audio compatibility dependency
        if: matrix.python-version == '3.13'
        run: pip install 'audioop-lts>=0.2.2'

      - name: Check FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Static import sanity check
        run: |
          python - <<'PY'
          import importlib
          deps = [
              'google.genai',
              'pytrends',
              'pydub',
              'requests',
              'dotenv',
          ]
          for dep in deps:
              try:
                  importlib.import_module(dep)
              except Exception as exc:
                  raise SystemExit(f"Import failed for {dep}: {exc}")
          PY

      - name: Ruff lint
        run: ruff check podcast_generator.py utils.py tests/

      - name: Byte-compile python
        run: python -m compileall podcast_generator.py utils.py

      - name: Audit Python dependencies
        run: |
          set +e
          pip-audit --format=json --output=pip-audit.json
          audit_exit=$?
          set -e
          AUDIT_EXIT=$audit_exit python - <<'PY'
          import json
          import os
          import sys

          with open("pip-audit.json", encoding="utf-8") as handle:
              report = json.load(handle)

          high = []
          other = []
          for dependency in report.get("dependencies", []):
              for vulnerability in dependency.get("vulns", []):
                  severity = str(vulnerability.get("severity", "")).upper()
                  item = f"{dependency.get('name')} {dependency.get('version')}: {vulnerability.get('id')}"
                  if severity in {"HIGH", "CRITICAL"}:
                      high.append(item)
                  else:
                      other.append(item)

          for item in other:
              print(f"::warning title=pip-audit::{item}")
          if high:
              for item in high:
                  print(f"::error title=pip-audit::{item}")
              sys.exit(1)
          audit_exit = int(os.environ["AUDIT_EXIT"])
          if audit_exit not in (0, 1):
              sys.exit(audit_exit)
          PY

      - name: Run pytest with coverage
        run: >-
          pytest -q
          --cov=podcast_generator
          --cov=utils
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=40
          --junitxml=test-results.xml

      - name: Markdown lint
        run: python -m pymarkdown -c .pymarkdown.toml scan .

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: podcast-reports-python-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore
